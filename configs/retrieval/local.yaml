schema_version: 1

inputs:
  index_config_file: configs/indexes/qdrant.yaml
  index_manifest_file: data/processed/techqa/indexes/full/manifest.json

retrieval:
  default_top_k: 10
  dense_candidate_k: 50
  sparse_candidate_k: 50
  hybrid_candidate_k: 50
  mmr_lambda: 0.65
  reciprocal_rank_constant: 60
  dense_weight: 0.60

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 32
