[project]
name = "resolverag"
version = "0.1.0"
description = "An evaluation-first production RAG system for evidence-grounded technical support."
readme = "README.md"
authors = [
    { name = "Rathish-Rajendran", email = "rathishrajendran9601@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.29.0",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # Python style errors
    "F",   # Pyflakes correctness checks
    "I",   # Import ordering
    "B",   # Common bug patterns
    "UP",  # Modern Python syntax
    "SIM", # Simplification opportunities
    "RUF", # Ruff-specific checks
]

[tool.ruff.lint.isort]
known-first-party = ["resolverag"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=resolverag",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "integration: tests that use infrastructure, files, models, or network resources",
]

[tool.coverage.run]
branch = true
source = ["resolverag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.uv]
required-version = "==0.11.24"