minimum_pre_commit_version: "4.0.0"

default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types:
          - python

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types:
          - python

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types:
          - python
        pass_filenames: false

      - id: unit-tests
        name: Unit tests
        entry: uv run pytest -m "not integration"
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
